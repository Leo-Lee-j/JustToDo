name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify frontend
        run: pnpm run build
      - name: Verify backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $pattern = "(?ms)^##\s+\[?$([regex]::Escape($version))\]?[^\r\n]*\r?\n(?<body>.*?)(?=^##\s+\[?\d+\.\d+\.\d+\]?|\z)"
          $content = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md is missing a release section for version $version."
          }
          $notes = $match.Groups['body'].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md release section for version $version is empty."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'body<<RELEASE_NOTES'
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $notes
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'RELEASE_NOTES'

      # Installer bundles can be produced without updater metadata when the
      # signing key is missing. Fail early instead of publishing a release that
      # can never be discovered by the in-app updater.
      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing repository secret SIGNING_PRIVATE_KEY; updater artifacts will not be generated.'
          }
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: JustToDo ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # tauri-action@v0 publishes latest.json with this input.
          includeUpdaterJson: true
          # Use the same pinned package manager configured above.
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: Verify updater metadata was published
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseApiUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          $maxAttempts = 12
          $retryDelaySeconds = 10
          $lastError = $null
          $metadataPublished = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $release = Invoke-RestMethod `
                -Method Get `
                -Uri $releaseApiUrl `
                -Headers $headers `
                -TimeoutSec 30 `
                -ErrorAction Stop

              $metadata = @($release.assets | Where-Object {
                $_.name -eq 'latest.json' -and $_.state -eq 'uploaded' -and $_.size -gt 0
              }) | Select-Object -First 1

              if ($null -ne $metadata) {
                Write-Host "Verified uploaded latest.json via the Release API (attempt $attempt of $maxAttempts, $($metadata.size) bytes)."
                $metadataPublished = $true
                break
              }

              $availableAssets = @($release.assets | ForEach-Object {
                "$($_.name) (state=$($_.state), size=$($_.size))"
              }) -join ', '
              if ([string]::IsNullOrWhiteSpace($availableAssets)) {
                $availableAssets = '(none)'
              }
              $lastError = "Release was found, but no uploaded, non-empty latest.json asset is available. Assets: $availableAssets"
            } catch {
              $lastError = $_.Exception.Message
            }

            if ($attempt -lt $maxAttempts) {
              Write-Host "latest.json is not available through the Release API yet (attempt $attempt of $maxAttempts): $lastError Retrying in $retryDelaySeconds seconds."
              Start-Sleep -Seconds $retryDelaySeconds
            }
          }

          if (-not $metadataPublished) {
            throw "latest.json was not published for ${{ github.ref_name }} after $maxAttempts API checks: $lastError"
          }
