name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify frontend
        run: npm run build
      - name: Verify backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $pattern = "(?ms)^##\s+\[?$([regex]::Escape($version))\]?[^\r\n]*\r?\n(?<body>.*?)(?=^##\s+\[?\d+\.\d+\.\d+\]?|\z)"
          $content = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md is missing a release section for version $version."
          }
          $notes = $match.Groups['body'].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "CHANGELOG.md release section for version $version is empty."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'body<<RELEASE_NOTES'
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $notes
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'RELEASE_NOTES'

      # Installer bundles can be produced without updater metadata when the
      # signing key is missing. Fail early instead of publishing a release that
      # can never be discovered by the in-app updater.
      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing repository secret SIGNING_PRIVATE_KEY; updater artifacts will not be generated.'
          }
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: JustToDo ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Keep asset publication explicit so an already-existing release cannot
      # end up with only its tag/version and no downloadable installers.
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/**/*
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater metadata was published
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json"
          try {
            $response = Invoke-WebRequest -Uri $assetUrl -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" } -UseBasicParsing -TimeoutSec 30
            if ($response.StatusCode -ne 200) { throw "HTTP $($response.StatusCode)" }
          } catch {
            throw "latest.json was not published at ${assetUrl}: $($_.Exception.Message)"
          }
